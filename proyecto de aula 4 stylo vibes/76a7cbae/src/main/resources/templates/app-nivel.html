<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{comunes :: head(${nivel.titulo})}"></head>
<body>
<div th:replace="~{comunes :: barraApp}"></div>

<main class="contenedor">
    <nav class="migas" aria-label="Ruta de navegación">
        <a th:href="@{/app}">Mi espacio</a>
        <span aria-hidden="true">/</span>
        <span th:text="'Nivel ' + ${nivel.numero}">Nivel 1</span>
    </nav>

    <header class="cabecera-nivel">
        <div class="cabecera-nivel__texto">
            <span class="etiqueta etiqueta--menta" th:text="'Nivel ' + ${nivel.numero} + ' de 5'">Nivel 1 de 5</span>
            <h1 th:text="${nivel.titulo}">Tipo de rostro</h1>
            <p th:text="${nivel.subtitulo}"></p>
            <p class="texto-suave" th:if="${contenido != null}" th:text="${contenido.texto}"></p>
        </div>
        <div class="cabecera-nivel__imagen">
            <img th:src="${nivel.imagen}" th:alt="${nivel.titulo}">
        </div>
    </header>

    <div class="aviso aviso--error aviso--lista" th:if="${errores != null and !errores.isEmpty()}">
        <p><strong>Revisa estas respuestas:</strong></p>
        <ul>
            <li th:each="error : ${errores}" th:text="${error}"></li>
        </ul>
    </div>

    <form th:action="@{/app/nivel/{n}(n=${nivel.numero})}" method="post" class="cuestionario">
        <fieldset class="pregunta" th:each="pregunta, iter : ${nivel.preguntas}">
            <legend class="pregunta__titulo">
                <span class="pregunta__numero" th:text="${iter.count}">1</span>
                <span th:text="${pregunta.enunciado}">Pregunta</span>
            </legend>
            <p class="pregunta__ayuda" th:if="${pregunta.ayuda != null}" th:text="${pregunta.ayuda}"></p>
            <p class="pregunta__ayuda" th:if="${pregunta.multiple}">
                <span th:text="'Puedes elegir hasta ' + ${pregunta.maxSeleccion} + ' opciones.'"></span>
            </p>
            <div class="opciones">
                <label class="opcion" th:each="opcion : ${pregunta.opciones}">
                    <input th:if="${pregunta.multiple}" type="checkbox"
                           th:name="${pregunta.id}" th:value="${opcion.valor}"
                           th:checked="${valores[pregunta.id] != null and #lists.contains(valores[pregunta.id], opcion.valor)}">
                    <input th:unless="${pregunta.multiple}" type="radio"
                           th:name="${pregunta.id}" th:value="${opcion.valor}"
                           th:checked="${valores[pregunta.id] != null and #lists.contains(valores[pregunta.id], opcion.valor)}">
                    <span class="opcion__marca" aria-hidden="true"></span>
                    <span class="opcion__texto" th:text="${opcion.texto}">Opción</span>
                </label>
            </div>
        </fieldset>

        <div class="cuestionario__pie">
            <p class="nota">Todas las preguntas son obligatorias. Puedes cambiar tus respuestas repitiendo el nivel cuando quieras.</p>
            <div class="cuestionario__acciones">
                <a class="boton boton--fantasma" th:href="@{/app}">Volver a mi espacio</a>
                <button type="submit" class="boton boton--grande">Guardar y continuar</button>
            </div>
        </div>
    </form>
</main>

<footer th:replace="~{comunes :: pie}"></footer>
</body>
</html>
