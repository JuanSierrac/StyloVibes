spring.application.name=StyloVibes
server.port=8080

# --- Thymeleaf ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- Mail (recuperación de contraseña). Sin credenciales: el enlace se imprime en consola ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- App ---
stylovibes.base-url=${APP_BASE_URL:http://localhost:8080}
stylovibes.password-reset.token-minutes=30
stylovibes.seed.enabled=true
stylovibes.seed.admin.email=${ADMIN_EMAIL:admin@stylovibes.com}
stylovibes.seed.admin.password=${ADMIN_PASSWORD:Admin123*}

# --- Sesión ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

logging.level.com.stylovibes=${LOG_LEVEL_STYLOVIBES:INFO}
