<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Artículo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="container-fluid">
  <div class="row">
    <aside th:replace="~{fragments/layout :: adminMenu}"></aside>
    <main class="col py-4 px-md-4">
<h1 class="h3 mb-3" th:text="${form.id == null} ? 'Nuevo artículo' : 'Editar artículo'">Artículo</h1>
<form th:action="@{/admin/articulos/guardar}" th:object="${form}" method="post" class="sv-card sv-form" style="max-width:56rem" novalidate>
  <input type="hidden" th:field="*{id}">
  <div class="mb-3">
    <label class="form-label" for="titulo">Título</label>
    <input type="text" class="form-control" id="titulo" th:field="*{titulo}">
    <div class="field-error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="categoriaId">Categoría</label>
    <select class="form-select" id="categoriaId" th:field="*{categoriaId}">
      <option value="">Selecciona…</option>
      <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}">Cat</option>
    </select>
    <div class="field-error" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="resumen">Resumen (máx. 300)</label>
    <textarea class="form-control" rows="2" id="resumen" th:field="*{resumen}"></textarea>
    <div class="field-error" th:if="${#fields.hasErrors('resumen')}" th:errors="*{resumen}"></div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="contenido">Contenido (separa párrafos con una línea en blanco)</label>
    <textarea class="form-control" rows="12" id="contenido" th:field="*{contenido}"></textarea>
    <div class="field-error" th:if="${#fields.hasErrors('contenido')}" th:errors="*{contenido}"></div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="imagenUrl">URL de imagen (opcional)</label>
    <input type="text" class="form-control" id="imagenUrl" th:field="*{imagenUrl}">
  </div>
  <div class="form-check form-switch mb-4">
    <input class="form-check-input" type="checkbox" id="publicado" th:field="*{publicado}">
    <label class="form-check-label" for="publicado">Publicado</label>
  </div>
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-sv">Guardar</button>
    <a class="btn btn-sv-outline" th:href="@{/admin/articulos}">Cancelar</a>
  </div>
</form>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
