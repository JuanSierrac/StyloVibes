<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="container-fluid">
  <div class="row">
    <aside th:replace="~{fragments/layout :: adminMenu}"></aside>
    <main class="col py-4 px-md-4">
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Usuarios</h1>
  <a class="btn btn-sv" th:href="@{/admin/usuarios/nuevo}">Nuevo usuario</a>
</div>
<div class="table-responsive">
  <table class="table sv-table align-middle">
    <thead><tr><th>Nombre</th><th>Correo</th><th>Roles</th><th>Estado</th><th></th></tr></thead>
    <tbody>
      <tr th:each="u : ${items}">
        <td th:text="${u.nombreCompleto}">Nombre</td>
        <td th:text="${u.email}">correo</td>
        <td><span class="badge text-bg-light me-1" th:each="r : ${u.roles}" th:text="${r.nombre}">ROL</span></td>
        <td><span class="badge" th:classappend="${u.activo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${u.activo ? 'Activo' : 'Inactivo'}">Estado</span></td>
        <td class="text-end text-nowrap">
          <a class="btn btn-sm btn-lavanda" th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}">Editar</a>
          <form class="d-inline" method="post" data-confirm="¿Eliminar este usuario?" th:action="@{/admin/usuarios/{id}/eliminar(id=${u.id})}">
            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
