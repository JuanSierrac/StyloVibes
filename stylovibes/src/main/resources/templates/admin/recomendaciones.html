<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Recomendaciones')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="container-fluid">
  <div class="row">
    <aside th:replace="~{fragments/layout :: adminMenu}"></aside>
    <main class="col py-4 px-md-4">
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Recomendaciones</h1>
  <a class="btn btn-sv" th:href="@{/admin/recomendaciones/nuevo}">Nueva recomendación</a>
</div>
<div class="table-responsive">
  <table class="table sv-table align-middle">
    <thead><tr><th>Título</th><th>Aplica a</th><th>Estado</th><th></th></tr></thead>
    <tbody>
      <tr th:each="r : ${items}">
        <td th:text="${r.titulo}">Título</td>
        <td th:text="${r.contexto}">Contexto</td>
        <td><span class="badge" th:classappend="${r.activo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${r.activo ? 'Activa' : 'Inactiva'}">Estado</span></td>
        <td class="text-end text-nowrap">
          <a class="btn btn-sm btn-lavanda" th:href="@{/admin/recomendaciones/{id}/editar(id=${r.id})}">Editar</a>
          <form class="d-inline" method="post" data-confirm="¿Eliminar esta recomendación?" th:action="@{/admin/recomendaciones/{id}/eliminar(id=${r.id})}">
            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
