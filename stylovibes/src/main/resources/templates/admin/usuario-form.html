<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="container-fluid">
  <div class="row">
    <aside th:replace="~{fragments/layout :: adminMenu}"></aside>
    <main class="col py-4 px-md-4">
<h1 class="h3 mb-3" th:text="${form.id == null} ? 'Nuevo usuario' : 'Editar usuario'">Usuario</h1>
<div class="alert alert-danger" th:if="${ko != null}" th:text="${ko}"></div>
<form th:action="@{/admin/usuarios/guardar}" th:object="${form}" method="post" class="sv-card sv-form" style="max-width:40rem" novalidate>
  <input type="hidden" th:field="*{id}">
  <div class="row g-3">
    <div class="col-sm-6"><label class="form-label" for="nombre">Nombre</label>
      <input type="text" class="form-control" id="nombre" th:field="*{nombre}">
      <div class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div></div>
    <div class="col-sm-6"><label class="form-label" for="apellido">Apellido</label>
      <input type="text" class="form-control" id="apellido" th:field="*{apellido}">
      <div class="field-error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div></div>
    <div class="col-12"><label class="form-label" for="email">Correo</label>
      <input type="email" class="form-control" id="email" th:field="*{email}">
      <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div></div>
    <div class="col-12"><label class="form-label" for="password">Contraseña</label>
      <input type="password" class="form-control" id="password" th:field="*{password}" autocomplete="new-password">
      <div class="form-text" th:text="${form.id == null} ? 'Obligatoria (mínimo 8 caracteres).' : 'Déjala vacía para no cambiarla.'">ayuda</div></div>
    <div class="col-12"><span class="form-label d-block">Roles</span>
      <div class="form-check form-check-inline" th:each="r : ${rolesDisponibles}">
        <input class="form-check-input" type="checkbox" th:id="${'rol_' + r}" th:field="*{roles}" th:value="${r}">
        <label class="form-check-label" th:for="${'rol_' + r}" th:text="${r}">ROL</label>
      </div>
      <div class="field-error" th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}"></div></div>
    <div class="col-12"><div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}">
      <label class="form-check-label" for="activo">Cuenta activa</label></div></div>
  </div>
  <div class="d-flex gap-2 mt-4">
    <button type="submit" class="btn btn-sv">Guardar</button>
    <a class="btn btn-sv-outline" th:href="@{/admin/usuarios}">Cancelar</a>
  </div>
</form>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
