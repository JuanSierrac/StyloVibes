<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Recuperar contraseña')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="auth-wrap">
  <div class="auth-card">
    <h1 class="h3 mb-1">Recupera tu contraseña</h1>
    <p class="text-muted">Te enviaremos un enlace para crear una nueva.</p>
    <form th:action="@{/recuperar}" th:object="${forgot}" method="post" class="sv-form" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>
      <button type="submit" class="btn btn-sv w-100">Enviar enlace</button>
    </form>
    <p class="small mt-3 mb-0"><a th:href="@{/login}">Volver a ingresar</a></p>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
