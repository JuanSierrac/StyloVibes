<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="auth-wrap">
  <div class="auth-card" style="max-width:32rem">
    <h1 class="h3 mb-1">Crea tu cuenta</h1>
    <p class="text-muted">Gratis, para guardar tu diagnóstico y recibir recomendaciones personalizadas.</p>
    <form th:action="@{/registro}" th:object="${registro}" method="post" class="sv-form" novalidate>
      <div class="row g-3">
        <div class="col-sm-6">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
          <div class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>
        <div class="col-sm-6">
          <label for="apellido" class="form-label">Apellido</label>
          <input type="text" class="form-control" id="apellido" th:field="*{apellido}" th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'">
          <div class="field-error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
        </div>
        <div class="col-12">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" autocomplete="username">
          <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="col-12">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" autocomplete="new-password">
          <div class="form-text">Mínimo 8 caracteres, con letras y números.</div>
          <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="col-12">
          <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control" id="confirmarPassword" th:field="*{confirmarPassword}" th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'is-invalid'" autocomplete="new-password">
          <div class="field-error" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></div>
        </div>
      </div>
      <button type="submit" class="btn btn-sv w-100 mt-4">Crear cuenta</button>
    </form>
    <p class="small mt-3 mb-0">¿Ya tienes cuenta? <a th:href="@{/login}">Ingresa</a></p>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
