<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="auth-wrap">
  <div class="auth-card">
    <h1 class="h3 mb-1">Bienvenido de nuevo</h1>
    <p class="text-muted">Ingresa para ver tu perfil de imagen.</p>
    <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos, o cuenta desactivada.</div>
    <div class="alert alert-success" th:if="${param.logout}">Cerraste sesión correctamente.</div>
    <form th:action="@{/login}" method="post" class="sv-form">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" name="email" required autofocus autocomplete="username">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-sv w-100">Ingresar</button>
    </form>
    <div class="d-flex justify-content-between mt-3 small">
      <a th:href="@{/recuperar}">Olvidé mi contraseña</a>
      <a th:href="@{/registro}">Crear cuenta</a>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
